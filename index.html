<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSAM Design Lab Safety Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 800px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .question {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .question-title {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .options label {
      display: block;
      margin-bottom: 4px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
    #show-answers {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>CSAM Design Lab Safety & Equipment Quiz</h1>
  <p>Answer all questions, then click "Grade Quiz" to see your score.</p>

  <div id="quiz"></div>

  <button id="grade-btn">Grade Quiz</button>


  <div id="result"></div>

  <script>
    // ===== Question pool (up to 100) =====
    // Each question: text, options array, and index of correct option
    const questionPool = [
      {
        text: "Who can grant access to the CSAM Design Lab?",
        options: [
          "Any student who has used it before",
          "Professor Steven Greenstein",
          "Campus security",
          "Anyone with a building badge"
        ],
        answer: 1
      },
      {
        text: "What is the primary purpose of this space?",
        options: [
          "Casual socializing and games",
          "Student research and project work",
          "Storage of extra equipment only",
          "Hosting parties and events"
        ],
        answer: 1
      },
      {
        text: "Using the space is considered:",
        options: [
          "A guaranteed right for all students",
          "A privilege that can be limited or revoked",
          "Only for faculty and staff",
          "Optional and unregulated"
        ],
        answer: 1
      },
      {
        text: "Before using equipment independently, users must:",
        options: [
          "Sign a paper log only",
          "Complete required safety orientation/training",
          "Watch any YouTube video of their choice",
          "Bring their own PPE"
        ],
        answer: 1
      },
      {
        text: "Minors in the CSAM Design Lab must:",
        options: [
          "Work alone as long as they are quiet",
          "Be directly supervised by a trained adult at all times",
          "Only use 3D printers",
          "Sit and watch but never touch equipment"
        ],
        answer: 1
      },
      {
        text: "Which behavior is allowed under the code of conduct?",
        options: [
          "Running between machines",
          "Climbing or swinging on the dance pole without Professor Greenstein present",
          "Calm, focused work without horseplay",
          "Eating snacks over the laser cutter"
        ],
        answer: 2
      },
      {
        text: "Where should food and drinks be kept?",
        options: [
          "Anywhere in the room",
          "On top of enclosed machines",
          "At designated tables away from equipment",
          "Next to the laser for convenience"
        ],
        answer: 2
      },
      {
        text: "The dance pole in the room may be used for:",
        options: [
          "Climbing, spinning, and tricks",
          "Attaching ropes for swinging",
          "Acrobatic or recreational activity only",
          "No climbing, swinging, or recreational use unless Professor Greenstein is present and permits it"
        ],
        answer: 3
      },
      {
        text: "Users must NOT operate equipment if they are:",
        options: [
          "Wearing closed-toe shoes",
          "Well-rested and alert",
          "Under the influence of alcohol or drugs",
          "Wearing safety glasses"
        ],
        answer: 2
      },
      {
        text: "Closed-toe shoes are:",
        options: [
          "Optional, just recommended",
          "Required when using any fabrication equipment",
          "Only needed for the laser cutter",
          "Not allowed in the room"
        ],
        answer: 1
      },
      {
        text: "Safety glasses are required when:",
        options: [
          "Operating or observing the Cameo 4 vinyl cutter",
          "Looking at your phone",
          "Sitting at a clean desk",
          "Walking in the hallway"
        ],
        answer: 0
      },
      {
        text: "3D printers and the laser must normally be operated:",
        options: [
          "With enclosures open to keep them cool",
          "With enclosures closed during normal operation",
          "Only with doors removed",
          "Only when no one is nearby"
        ],
        answer: 1
      },
      {
        text: "What must you NEVER do with guards or interlocks?",
        options: [
          "Inspect them during training",
          "Bypass or defeat them",
          "Report damage to staff",
          "Check that they are engaged"
        ],
        answer: 1
      },
      {
        text: "Are you allowed to move desks that protect the floor power outlet area?",
        options: [
          "Yes, whenever you want more space",
          "Only to plug in more equipment",
          "No, they must remain in place as a safety barrier",
          "Yes, if a friend needs an outlet"
        ],
        answer: 2
      },
      {
        text: "Which action is prohibited?",
        options: [
          "Reporting a hazard to staff",
          "Overriding or tampering with fire or ventilation alarms",
          "Wearing PPE in machine areas",
          "Cleaning your workstation"
        ],
        answer: 1
      },
      {
        text: "You may use equipment:",
        options: [
          "Only if you are trained and authorized on that machine",
          "If you have used something similar at home",
          "If you watched one online video",
          "If a friend says it is okay"
        ],
        answer: 0
      },
      {
        text: "Before leaving the space, you must:",
        options: [
          "Leave machines running unattended",
          "Power down equipment and clean your area",
          "Hide scrap under the table",
          "Unplug everything in the room"
        ],
        answer: 1
      },
      {
        text: "The scrap and reuse area is for:",
        options: [
          "Any trash and food waste",
          "Safe offcuts and failed parts that can be repurposed",
          "Hazardous chemicals",
          "Personal belongings"
        ],
        answer: 1
      },
      {
        text: "What should you place in the reuse area?",
        options: [
          "Sharp metal shards",
          "Broken glass",
          "Clearly safe, non-sharp materials like some wood or plastic offcuts",
          "Batteries and electronics"
        ],
        answer: 2
      },
      {
        text: "Regular recycling bins should be used for:",
        options: [
          "Clean paper and cardboard as directed",
          "Any chemical containers",
          "Sharps and broken tools",
          "Burned material from the laser"
        ],
        answer: 0
      },
      {
        text: "Who can adjust or change the Cameo 4 vinyl cutter blade?",
        options: [
          "Any student using it",
          "Only staff or authorized personnel",
          "Visitors who ask nicely",
          "No one; it never needs changing"
        ],
        answer: 1
      },
      {
        text: "When operating the Cameo 4 vinyl cutter, you should:",
        options: [
          "Reach under the moving carriage",
          "Keep hands clear of moving parts and tie back long hair",
          "Remove safety guards",
          "Stand far away and not watch it"
        ],
        answer: 1
      },
      {
        text: "Which material is often banned in laser cutters due to hazardous fumes?",
        options: [
          "Plain paper",
          "Cardboard",
          "PVC or vinyl",
          "Approved plywood"
        ],
        answer: 2
      },
      {
        text: "The laser cutter must never be:",
        options: [
          "Used with the lid closed",
          "Left running unattended",
          "Used with ventilation on",
          "Used with air assist"
        ],
        answer: 1
      },
      {
        text: "If you see a small flare-up (flame) in the laser cutter, you should first:",
        options: [
          "Ignore it; it will go away",
          "Open the lid and walk away",
          "Stop or pause the job and stay at the machine",
          "Turn off room lights"
        ],
        answer: 2
      },
      {
        text: "In an emergency with a fire you cannot control, you should:",
        options: [
          "Pull the fire alarm and evacuate",
          "Stay and keep filming",
          "Hide under a table",
          "Turn the music up"
        ],
        answer: 0
      },
      {
        text: "3D printer hazards include:",
        options: [
          "Cold surfaces only",
          "Hot nozzle/bed and fumes from melted plastic",
          "Only noise",
          "Only bright lights"
        ],
        answer: 1
      },
      {
        text: "When removing a 3D print from the bed, you should:",
        options: [
          "Grab it immediately with bare hands",
          "Let it cool and use tools carefully",
          "Hit the bed to knock it loose",
          "Use water to cool it quickly"
        ],
        answer: 1
      },
      {
        text: "If you smell strong burning or unusual chemical odors from any machine, you should:",
        options: [
          "Ignore it and keep going",
          "Turn off ventilation",
          "Pause/stop the job and notify staff",
          "Open all covers and put your face close"
        ],
        answer: 2
      },
      {
        text: "When using scraping tools, you should:",
        options: [
          "Point the sharp edge toward your body",
          "Scrape away from your body and hands",
          "Use them as hammers",
          "Give them to untrained visitors"
        ],
        answer: 1
      },
      {
        text: "Using the sign-in system is important because it:",
        options: [
          "Is only for fun",
          "Tracks space usage and accountability",
          "Lets you skip training",
          "Replaces safety rules"
        ],
        answer: 1
      },
      {
        text: "When signing in digitally, you should provide:",
        options: [
          "Only a nickname",
          "Your name, ID (if required), and which machines you will use",
          "Only your favorite color",
          "No information at all"
        ],
        answer: 1
      },
      {
        text: "Near-miss incidents (almost accidents) should be:",
        options: [
          "Ignored",
          "Reported using the incident form or to staff",
          "Filmed and posted online only",
          "Used as jokes"
        ],
        answer: 1
      },
      {
        text: "Consequences for serious or repeated violations of rules may include:",
        options: [
          "Extra free time in the space",
          "Temporary or permanent loss of access",
          "Automatic awards",
          "No consequences"
        ],
        answer: 1
      },
      {
        text: "You should operate equipment only when:",
        options: [
          "You are distracted and multitasking",
          "You are attentive and focused",
          "You are in a hurry to leave",
          "You are on the phone"
        ],
        answer: 1
      },
      {
        text: "Which is an example of horseplay?",
        options: [
          "Quietly adjusting a setting",
          "Running and pushing near machines",
          "Asking a safety question",
          "Filling out a checklist"
        ],
        answer: 1
      },
      {
        text: "If you do not understand how to use a machine, you should:",
        options: [
          "Guess and try anyway",
          "Ask trained staff or an instructor for help",
          "Press all the buttons",
          "Disassemble it"
        ],
        answer: 1
      },
      {
        text: "Approved materials for machines are:",
        options: [
          "Anything you bring from home",
          "Only those listed as allowed by the space’s guidelines",
          "All unknown plastics",
          "Any random scrap found outside"
        ],
        answer: 1
      },
      {
        text: "The space may track attendance and usage using:",
        options: [
          "A digital sign-in form",
          "Random guessing",
          "No records at all",
          "Only paper notes lost easily"
        ],
        answer: 0
      }
      // Add more questions here (up to 100 total) if you like.
    ];

    const NUM_QUESTIONS = 10;

    function getRandomQuestions(pool, count) {
      const indices = pool.map((_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      const selectedIndices = indices.slice(0, count);
      return selectedIndices.map(i => ({ ...pool[i], poolIndex: i }));
    }

    const selectedQuestions = getRandomQuestions(questionPool, NUM_QUESTIONS);

    function renderQuiz() {
      const quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = "";
      selectedQuestions.forEach((q, idx) => {
        const qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.dataset.poolIndex = q.poolIndex;

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = (idx + 1) + ". " + q.text;

        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        q.options.forEach((opt, optIndex) => {
          const label = document.createElement("label");
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "q" + idx;
          radio.value = optIndex;
          label.appendChild(radio);
          label.appendChild(document.createTextNode(" " + opt));
          optionsDiv.appendChild(label);
        });

        qDiv.appendChild(title);
        qDiv.appendChild(optionsDiv);
        quizDiv.appendChild(qDiv);
      });
    }

    function gradeQuiz() {
      let score = 0;
      selectedQuestions.forEach((q, idx) => {
        const radios = document.getElementsByName("q" + idx);
        let userAnswer = null;
        radios.forEach(r => {
          if (r.checked) {
            userAnswer = parseInt(r.value, 10);
          }
        });
        if (userAnswer === q.answer) {
          score++;
        }
      });
      const percent = Math.round((score / selectedQuestions.length) * 100);
      document.getElementById("result").innerHTML =
        "Score: " + score + " / " + selectedQuestions.length + " (" + percent + "%)" +
        "<br><br>Please email a screenshot of this score to <strong>greensteins@mail.montclair.edu</strong> to complete your training record.";
    }

    function showCorrectAnswers() {
      const questionDivs = document.querySelectorAll(".question");
      questionDivs.forEach((qDiv, idx) => {
        const q = selectedQuestions[idx];
        const labels = qDiv.querySelectorAll("label");
        labels.forEach((label, optionIndex) => {
          label.style.fontWeight = (optionIndex === q.answer) ? "bold" : "normal";
          label.style.color = (optionIndex === q.answer) ? "green" : "black";
        });
      });
    }

    document.getElementById("grade-btn").addEventListener("click", gradeQuiz);
    
    renderQuiz();
  </script>
</body>
</html>
